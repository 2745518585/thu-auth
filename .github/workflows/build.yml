name: Build & Test

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install build tool
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install built package
        run: python -c "import glob, subprocess, sys; subprocess.check_call([sys.executable, '-m', 'pip', 'install', *glob.glob('dist/*.whl')])"

      - name: Install check tools
        run: python -m pip install ruff pyright

      - name: Run lint and format checks
        run: |
          ruff check src tests entry.py
          ruff format --check src tests entry.py

      - name: Run type checks
        run: pyright

      - name: Run CLI help test
        run: thu-auth --help

      - name: Run resilience tests
        run: python -m unittest discover -s tests -v

      - name: Verify installed package entry point
        run: python -c "import os, subprocess, tempfile; subprocess.check_call(['thu-auth', '--version'], cwd=tempfile.gettempdir())"
