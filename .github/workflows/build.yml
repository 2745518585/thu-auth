name: Build & Test

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install build tool
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  test-matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install built package
        run: python -c "import glob, subprocess, sys; subprocess.check_call([sys.executable, '-m', 'pip', 'install', *glob.glob('dist/*.whl')])"

      - name: Install check tools
        run: python -m pip install ruff==0.16.10 pyright==1.1.414

      - name: Run lint and format checks
        run: |
          python -m ruff check src tests entry.py
          python -m ruff format --check src tests entry.py

      - name: Run type checks
        run: python -m pyright

      - name: Run CLI help test
        run: thu-auth --help

      - name: Run resilience tests
        run: python -m unittest discover -s tests -v

      - name: Verify installed package entry point
        run: python -c "import os, subprocess, tempfile; subprocess.check_call(['thu-auth', '--version'], cwd=tempfile.gettempdir())"

  # Keep the check name required by the existing branch protection rules.
  test:
    runs-on: ubuntu-latest
    needs: test-matrix
    if: ${{ always() }}
    steps:
      - name: Require all matrix tests to pass
        env:
          TEST_RESULT: ${{ needs.test-matrix.result }}
        run: |
          if [ "$TEST_RESULT" != "success" ]; then
            echo "Matrix tests did not all pass: $TEST_RESULT"
            exit 1
          fi
